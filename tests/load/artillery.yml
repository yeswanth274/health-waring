config:
  target: "http://localhost:3000"
  phases:
    - duration: 30
      arrivalRate: 10
      name: "Warm-up phase"
    - duration: 60
      arrivalRate: 50
      rampTo: 100
      name: "Ramp up load"
    - duration: 60
      arrivalRate: 100
      name: "Sustained high load"
  defaults:
    headers:
      Content-Type: "application/json"
scenarios:
  - name: "Clinical Decision Support Patient Risk Inference"
    flow:
      - get:
          url: "/"
